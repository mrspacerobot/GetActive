version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sportfriends-db
    environment:
      POSTGRES_DB: sportfriends
      POSTGRES_USER: sportuser
      POSTGRES_PASSWORD: sportpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportuser -d sportfriends"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sportfriends-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sportfriends
      SPRING_DATASOURCE_USERNAME: sportuser
      SPRING_DATASOURCE_PASSWORD: sportpass
      SPRING_JPA_HIBERNATE_DDL-AUTO: validate
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: